# dsh-model-chooser bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-model-chooser
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing the declaration, appends `dsh-model-chooser` to the bundle stack.
# Profile boot then merges THIS patch (a single `insert` of the plugin row).
# No profile file edits needed — one command installs and mounts.
#
# If the profile still carries a manual mount line for model-chooser in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting.

- insert:
    - id: model-chooser
      name: 'dsh-model-chooser'
